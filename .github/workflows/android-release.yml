name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build and publish signed Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1
          set -e
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;30.0.16248370"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --version 1.5.0 --locked

      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.WORDCRAFT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo 'Missing WORDCRAFT_RELEASE_KEYSTORE_BASE64 secret' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/android-signing"
          chmod 700 "$RUNNER_TEMP/android-signing"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/android-signing/wordcraft-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$CARGO_APK_RELEASE_KEYSTORE"
          chmod 600 "$CARGO_APK_RELEASE_KEYSTORE"
          test -s "$CARGO_APK_RELEASE_KEYSTORE"
          echo "CARGO_APK_RELEASE_KEYSTORE=$CARGO_APK_RELEASE_KEYSTORE" >> "$GITHUB_ENV"

      - name: Build and verify signed APK
        id: build
        shell: bash
        env:
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.WORDCRAFT_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CARGO_APK_RELEASE_KEYSTORE_PASSWORD" || { echo 'Missing WORDCRAFT_RELEASE_KEYSTORE_PASSWORD secret' >&2; exit 1; }
          cargo apk2 build --release --manifest-path apps/wordcraft-android/Cargo.toml
          APK=target/release/apk/wordcraft.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="wordcraft-android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            target/release/apk/wordcraft.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "WordCraft Android Release #${GITHUB_RUN_NUMBER}" \
            --notes "Signed APK built by GitHub Actions from commit ${GITHUB_SHA}.\nSHA-256: ${{ steps.build.outputs.sha256 }}"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-release-${{ github.sha }}
          path: target/release/apk/wordcraft.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-signing/wordcraft-release.jks"
