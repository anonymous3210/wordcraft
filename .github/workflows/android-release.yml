name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build and publish signed Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1
          set -e
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;30.0.16248370"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --version 1.5.0 --locked

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/apps/wordcraft-android/release-signing/wordcraft-release.jks"
          PASSWORD_FILE="$GITHUB_WORKSPACE/apps/wordcraft-android/release-signing/wordcraft-release-password.txt"
          test -s "$KEYSTORE"
          test -s "$PASSWORD_FILE"
          PASSWORD="$(tr -d '\r\n' < "$PASSWORD_FILE")"
          test -n "$PASSWORD"
          echo "::add-mask::$PASSWORD"
          {
            printf 'CARGO_APK_RELEASE_KEYSTORE=%s\n' "$KEYSTORE"
            printf 'CARGO_APK_RELEASE_KEYSTORE_PASSWORD=%s\n' "$PASSWORD"
          } >> "$GITHUB_ENV"
          unset PASSWORD

      - name: Build and verify signed APK
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo apk2 build --release --manifest-path apps/wordcraft-android/Cargo.toml
          APK=target/release/apk/wordcraft.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="wordcraft-android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            target/release/apk/wordcraft.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "WordCraft Android Release #${GITHUB_RUN_NUMBER}" \
            --notes "Signed APK built by GitHub Actions from commit ${GITHUB_SHA}.\nSHA-256: ${{ steps.build.outputs.sha256 }}"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-release-${{ github.sha }}
          path: target/release/apk/wordcraft.apk
          if-no-files-found: error
          retention-days: 30
