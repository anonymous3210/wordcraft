name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build signed Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;30.0.16248370"
          printf 'ANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_HOME=%s/ndk/30.0.16248370\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          printf 'NDK_HOME=%s/ndk/30.0.16248370\n' "$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --version 1.5.0 --locked

      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.WORDCRAFT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo 'Missing WORDCRAFT_RELEASE_KEYSTORE_BASE64 secret' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/android-signing"
          chmod 700 "$RUNNER_TEMP/android-signing"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/android-signing/wordcraft-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$CARGO_APK_RELEASE_KEYSTORE"
          chmod 600 "$CARGO_APK_RELEASE_KEYSTORE"
          test -s "$CARGO_APK_RELEASE_KEYSTORE"
          echo "CARGO_APK_RELEASE_KEYSTORE=$CARGO_APK_RELEASE_KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        env:
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.WORDCRAFT_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CARGO_APK_RELEASE_KEYSTORE_PASSWORD" || { echo 'Missing WORDCRAFT_RELEASE_KEYSTORE_PASSWORD secret' >&2; exit 1; }
          cargo apk2 build --release --manifest-path apps/wordcraft-android/Cargo.toml
          APK=target/release/apk/wordcraft.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-release-${{ github.sha }}
          path: target/release/apk/wordcraft.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-signing/wordcraft-release.jks"
